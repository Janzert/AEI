name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: uv run --locked pyrimaa_tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Ruff lint
        run: uv run --locked --extra dev ruff check .
      - name: Ruff format
        run: uv run --locked --extra dev ruff format --check .

  package:
    name: Build and check package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build
        run: uv build --no-sources
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Check the sdist includes the docs
        run: |
          for f in README.md USAGE.md AEI_PROTOCOL.md CHANGELOG.md LICENSE.txt; do
            tar tzf dist/*.tar.gz | grep -q "/$f\$" || { echo "sdist is missing $f"; exit 1; }
          done
      - name: Test the installed wheel
        run: uv run --isolated --no-project --with dist/*.whl pyrimaa_tests
